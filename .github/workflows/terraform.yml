name: terraform

on:
  pull_request:
    paths:
      - "examples/**"
      - "modules/**"
      - "lambdas/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "modules/**"
      - "lambdas/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Que hacer con el stack"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_DIR: examples/orphan-hunter
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' && (
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan'))
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -no-color -lock-timeout=5m | tee plan.txt

      - name: Comentar el plan en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### terraform plan · \`$TF_DIR\`"
            echo '<details><summary>Ver plan</summary>'
            echo
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

  apply:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -auto-approve -lock-timeout=5m

      - name: Registrar el nivel aplicado en el ledger
        run: python scripts/ladder.py sync

  destroy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: terraform init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform destroy
        run: terraform -chdir="$TF_DIR" destroy -auto-approve -lock-timeout=5m
